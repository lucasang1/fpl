<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="description" content="Fantasy Premier League standings for league 713788">
    <meta name="theme-color" content="#2a2a2a">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black">
    <meta name="apple-mobile-web-app-title" content="FPL Standings">
    <title>FPL League Standings</title>
    <link rel="icon" href="/favicon.svg" type="image/svg+xml">
    <link rel="manifest" href="/manifest.webmanifest">
    <script>
      document.documentElement.dataset.theme = "dark";
    </script>
    <link rel="stylesheet" href="styles.css">
    <script src="app.js" defer></script>
  </head>
  <body>
    <main class="team-detail-active">
      <header class="top-bar">
        <div class="title-group">
          <!-- <p class="eyebrow">Fantasy Premier League</p> -->
          <h1 id="league-name">Winner Takes All</h1>
        </div>
        <p id="status" role="status">Loading…</p>
      </header>

      <div id="standings-panel" class="table-wrap">
        <div class="table-toolbar">
          <div class="view-toggle" aria-label="Standings view">
            <button id="pairs-view" type="button" aria-pressed="true">Duo</button>
            <button id="teams-view" type="button" aria-pressed="false">Individual</button>
          </div>
          <div class="refresh-group">
            <p id="last-updated" aria-live="off" hidden></p>
            <button id="refresh" type="button" aria-label="Refresh standings" title="Refresh standings" hidden>
              <svg class="refresh-icon" viewBox="0 0 24 24" aria-hidden="true">
                <path d="M20.5 8A8.5 8.5 0 0 0 5.2 5.2L3 7.5"></path>
                <path d="M3 3.5v4h4"></path>
                <path d="M3.5 16a8.5 8.5 0 0 0 15.3 2.8l2.2-2.3"></path>
                <path d="M21 20.5v-4h-4"></path>
              </svg>
            </button>
          </div>
        </div>
        <table class="standings-table">
          <colgroup>
            <col class="col-rank">
            <col class="col-team">
            <col class="col-to-start">
            <col class="col-in-play">
            <col class="col-gw-indiv">
            <col class="col-gw-total">
            <col class="col-total">
          </colgroup>
          <thead>
            <tr>
              <th scope="col" aria-label="Rank"></th>
              <th scope="col">Team</th>
              <th scope="col" class="number">To<br>Start</th>
              <th scope="col" class="number">In<br>Play</th>
              <th scope="col" class="number">Indiv</th>
              <th scope="col" class="number">Duo</th>
              <th scope="col" class="number">Total</th>
            </tr>
          </thead>
          <tbody id="standings"></tbody>
        </table>
      </div>

      <div class="standings-gameweek" aria-label="Standings gameweek selection">
        <div class="gameweek-stepper" role="group" aria-label="Gameweek selection">
          <button data-gameweek-previous type="button" aria-label="Previous gameweek" title="Previous gameweek" disabled>
            <svg viewBox="0 0 24 24" aria-hidden="true">
              <path d="m15 18-6-6 6-6"></path>
            </svg>
          </button>
          <input class="gameweek-value" data-gameweek-value type="text" inputmode="numeric" pattern="[0-9]*" maxlength="2" aria-label="Gameweek number" disabled>
          <button data-gameweek-next type="button" aria-label="Next gameweek" title="Next gameweek" disabled>
            <svg viewBox="0 0 24 24" aria-hidden="true">
              <path d="m9 18 6-6-6-6"></path>
            </svg>
          </button>
        </div>
      </div>

      <section id="team-detail" class="team-detail team-detail-loading" aria-busy="true">
        <div class="team-detail-header" aria-hidden="true">
          <div class="team-detail-title">
            <span class="team-detail-placeholder team-detail-placeholder-badge"></span>
            <div class="team-detail-title-text">
              <span class="team-detail-placeholder team-detail-placeholder-title"></span>
            </div>
          </div>
          <span class="team-detail-placeholder team-detail-placeholder-score"></span>
        </div>
        <div class="ownership-list team-player-list" aria-hidden="true">
          <span class="team-detail-placeholder team-detail-placeholder-row"></span>
          <span class="team-detail-placeholder team-detail-placeholder-row"></span>
          <span class="team-detail-placeholder team-detail-placeholder-row"></span>
          <span class="team-detail-placeholder team-detail-placeholder-row"></span>
        </div>
      </section>

      <section id="team-summary-panel" class="team-summary-panel" aria-label="Team chips and value" hidden></section>

      <div class="mobile-team-gameweek" aria-label="Team gameweek selection">
        <div class="gameweek-stepper" role="group" aria-label="Gameweek selection">
          <button data-gameweek-previous type="button" aria-label="Previous gameweek" title="Previous gameweek" disabled>
            <svg viewBox="0 0 24 24" aria-hidden="true">
              <path d="m15 18-6-6 6-6"></path>
            </svg>
          </button>
          <input class="gameweek-value" data-gameweek-value type="text" inputmode="numeric" pattern="[0-9]*" maxlength="2" aria-label="Gameweek number" disabled>
          <button data-gameweek-next type="button" aria-label="Next gameweek" title="Next gameweek" disabled>
            <svg viewBox="0 0 24 24" aria-hidden="true">
              <path d="m9 18 6-6-6-6"></path>
            </svg>
          </button>
        </div>
      </div>

      <div id="importance-panel" class="ownership-panel">
        <div class="ownership-toolbar">
          <h2>Importance</h2>
          <div class="importance-controls">
            <button id="live-only-filter" class="live-only-filter" type="button" aria-pressed="false" hidden>
              <span class="live-only-checkbox" aria-hidden="true"></span>
              <span class="live-only-label">
                <span>Filter to</span>
                <span>Live Only</span>
              </span>
            </button>
            <label class="duo-select-label" for="duo-importance-select">
              <select id="duo-importance-select"></select>
            </label>
          </div>
        </div>
        <div id="player-ownership" class="ownership-list"></div>
        <nav id="importance-pagination" class="importance-pagination" aria-label="Importance pages" hidden>
          <button id="importance-previous" type="button" aria-label="Previous importance page">
            <svg viewBox="0 0 24 24" aria-hidden="true">
              <path d="m15 18-6-6 6-6"></path>
            </svg>
          </button>
          <span id="importance-page-status" aria-live="polite"></span>
          <button id="importance-next" type="button" aria-label="Next importance page">
            <svg viewBox="0 0 24 24" aria-hidden="true">
              <path d="m9 18 6-6-6-6"></path>
            </svg>
          </button>
        </nav>
      </div>

      <section id="stats-panel" class="stats-panel" aria-label="Stats">
        <section id="transfers-panel" class="transfers-panel" aria-label="Transfers made">
          <h2 class="stats-card-header">Transfers</h2>
          <div id="transfers-list" class="chips-list"></div>
        </section>
        <section id="chips-panel" class="chips-panel" aria-label="Chips">
          <h2 class="stats-card-header">Chips</h2>
          <div id="chips-list" class="chips-list"></div>
        </section>
      </section>

      <dialog id="importance-dialog" class="importance-dialog" aria-labelledby="importance-dialog-title">
        <div class="importance-dialog-header">
          <h3 id="importance-dialog-title"></h3>
          <button id="importance-dialog-close" class="importance-dialog-close" type="button" aria-label="Close player teams">
            <svg viewBox="0 0 24 24" aria-hidden="true">
              <path d="M18 6 6 18"></path>
              <path d="m6 6 12 12"></path>
            </svg>
          </button>
        </div>
        <div id="importance-dialog-body" class="importance-dialog-body"></div>
      </dialog>
    </main>
    <nav class="mobile-tab-bar" aria-label="Primary navigation">
      <button class="mobile-tab is-active" type="button" data-mobile-tab="league" aria-controls="standings-panel" aria-current="page">
        <svg viewBox="0 0 24 24" aria-hidden="true">
          <path d="M5 20V10"></path>
          <path d="M12 20V4"></path>
          <path d="M19 20v-7"></path>
        </svg>
        <span>League</span>
      </button>
      <button class="mobile-tab" type="button" data-mobile-tab="team" aria-controls="team-detail">
        <svg viewBox="0 0 24 24" aria-hidden="true">
          <path d="M12 3 4.5 6.5v5.8c0 4.1 3 7.3 7.5 8.7 4.5-1.4 7.5-4.6 7.5-8.7V6.5L12 3Z"></path>
          <path d="m9 12 2 2 4-4"></path>
        </svg>
        <span>Team</span>
      </button>
      <button class="mobile-tab" type="button" data-mobile-tab="importance" aria-label="Importance" aria-controls="importance-panel">
        <svg viewBox="0 0 24 24" aria-hidden="true">
          <circle cx="12" cy="12" r="8"></circle>
          <path d="M12 8v5"></path>
          <path d="M12 16h.01"></path>
        </svg>
        <span>Importance</span>
      </button>
      <button class="mobile-tab" type="button" data-mobile-tab="stats" aria-controls="stats-panel">
        <svg viewBox="0 0 24 24" aria-hidden="true">
          <path d="M4 4v16h16"></path>
          <path d="m7 16 4-5 3 3 5-7"></path>
        </svg>
        <span>Stats</span>
      </button>
    </nav>
  </body>
</html>
