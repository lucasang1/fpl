<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="description" content="Fantasy Premier League standings for league 713788">
    <title>FPL League Standings</title>
    <link rel="icon" href="/favicon.svg" type="image/svg+xml">
    <link rel="stylesheet" href="styles.css">
    <script src="app.js" defer></script>
  </head>
  <body>
    <main>
      <header class="top-bar">
        <div class="title-group">
          <p class="eyebrow">Fantasy Premier League</p>
          <h1 id="league-name">League standings</h1>
        </div>
        <p id="status" role="status">Loading standings…</p>
      </header>

      <div class="table-wrap">
        <div class="table-toolbar">
          <div class="view-toggle" aria-label="Standings view">
            <button id="teams-view" type="button" aria-pressed="true">Individual</button>
            <button id="pairs-view" type="button" aria-pressed="false">Pairs</button>
          </div>
          <div class="refresh-group">
            <p id="last-updated" aria-live="off"></p>
            <button id="refresh" type="button" aria-label="Refresh standings" title="Refresh standings">
              <svg class="refresh-icon" viewBox="0 0 24 24" aria-hidden="true">
                <path d="M20.5 8A8.5 8.5 0 0 0 5.2 5.2L3 7.5"></path>
                <path d="M3 3.5v4h4"></path>
                <path d="M3.5 16a8.5 8.5 0 0 0 15.3 2.8l2.2-2.3"></path>
                <path d="M21 20.5v-4h-4"></path>
              </svg>
            </button>
          </div>
        </div>
        <table>
          <thead>
            <tr>
              <th scope="col">Rank</th>
              <th scope="col">Team</th>
              <th scope="col">Manager</th>
              <th scope="col" class="number">GW</th>
              <th scope="col" class="number">Total</th>
            </tr>
          </thead>
          <tbody id="standings"></tbody>
        </table>
      </div>
    </main>
  </body>
</html>
